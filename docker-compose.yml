services:
  db:
    image: postgres:15-alpine
    container_name: danmark_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-danmark_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # The bot runs migrations on start, so it must not start before Postgres accepts
      # connections. `depends_on` alone only waits for the container, not the server.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-danmark_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: danmark_bot
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_USERNAME=${BOT_USERNAME}
      - GROUP_CHAT_ID=${GROUP_CHAT_ID}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_CHAT_ID=${ADMIN_CHAT_ID}
      - TIMEZONE=${TIMEZONE:-Europe/Copenhagen}
      # Point to the 'db' service container in the docker network
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-danmark_db}?schema=public
    env_file:
      - .env

volumes:
  postgres_data:
